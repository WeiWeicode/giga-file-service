# giga-file-service Pipeline(Runner:主機 2 WSL shell executor,tag windows-runner;與 Gateway 同一台主機)
#   check        所有分支:file-api 型別檢查、單元測試、migration 的 SQL Server 2012 語法檢查
#   deploy-test  develop:在主機 2 建置並更新 file-api(加入 Gateway 網路)
# 主機需有:${FILE_ENV_FILE} 與 FILE_SECRETS_DIR 內的機密檔(file-api/deploy/host2-set-secrets.sh 產生)、/srv/giga-files/test;
#           Gateway 已部署(giganexus-gw_default 網路);npm Registry Token 同其他專案(${NPM_TOKEN_FILE})
# migration 由開發者電腦 npm run db:migrate 套用(DATABASE.md §0.2),CI 不持有 file_migrate
stages: [check, deploy-test]

variables:
  FILE_ENV_FILE: /srv/giganexus/deploy/file.env
  NPM_TOKEN_FILE: /srv/giganexus/deploy/secrets/gitlab_npm_token

.runner: &runner
  tags: [windows-runner]

check:file-api:
  <<: *runner
  stage: check
  script:
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - cd file-api
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm test
    - npm run db:check-2012

deploy-test:
  <<: *runner
  stage: deploy-test
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  environment: { name: test }
  script:
    - test -f "$FILE_ENV_FILE" || { echo "缺少 $FILE_ENV_FILE(先在主機 2 執行 file-api/deploy/host2-set-secrets.sh)" >&2; exit 1; }
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA RELEASE_SHA=$CI_COMMIT_SHORT_SHA COMPOSE_ENV_FILES="$FILE_ENV_FILE"
    - export GITLAB_NPM_TOKEN="$(cat "$NPM_TOKEN_FILE")"
    - C="docker compose -f file-api/deploy/docker-compose.yml"
    # --pull:主機上的 node:22-alpine 可能被其他專案覆寫(同 Gateway 2026-10-02)
    - $C build --pull file-api
    - $C up -d --wait
    # 冒煙測試:SQL 與檔案根目錄可用;無內部 Token → 401
    - $C exec -T file-api wget -qO- http://127.0.0.1:51272/readyz
    - '$C exec -T file-api node -e "fetch(\"http://127.0.0.1:51272/v1/files\").then((r) => process.exit(r.status === 401 ? 0 : 1))" && echo "OK   /v1/files 無內部 Token → 401"'
